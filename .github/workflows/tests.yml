name: tests

on:
  push:
    # The ingest step commits the warehouse back to this repo. Without this the
    # commit would trigger another run, which would commit again — forever.
    paths-ignore:
      - 'warehouse/**'
  schedule:
    - cron: '0 2 * * *'    # nightly — builds the time series
  workflow_dispatch:

# The warehouse is a single file that this job reads, rewrites and pushes. Two jobs
# doing that at once lose one of the two runs, so they queue instead.
# cancel-in-progress stays false: cancelling a run throws away its results.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write          # needed to push the updated warehouse back

env:
  PW_WORKERS: 2            # pinned so run durations stay comparable over time

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
        continue-on-error: true       # failures are DATA, not build breaks

      # ---- ingest: results.json -> DuckDB ----------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt

      # Take the newest warehouse rather than the one from this commit's checkout.
      # If a run landed while this one was executing, ingesting into the stale copy
      # would silently drop that run from history.
      - name: Fetch the latest warehouse
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- warehouse/test_analytics.duckdb || \
            echo "no warehouse on main yet — ingest will create it"

      # Deliberately no continue-on-error: a test failure is data, but a pipeline
      # failure is a real break and should turn the run red.
      - name: Ingest results
        run: python pipeline/ingest.py --json results/results.json
        env:
          WAREHOUSE_DB: warehouse/test_analytics.duckdb

      - name: Commit the warehouse
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f warehouse/test_analytics.duckdb
          if git diff --staged --quiet; then
            echo "warehouse unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore(warehouse): ingest run ${{ github.run_id }} [skip ci]"
          # Land on top of whatever else reached main while the suite was running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # ---- artifacts: raw inputs, kept independently of the warehouse ------
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: results/
          retention-days: 90
          if-no-files-found: error    # empty results = the pipeline has no input
      # HTML report: previously uploaded by the scaffold playwright.yml workflow,
      # folded in here so failures stay debuggable from a single run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
