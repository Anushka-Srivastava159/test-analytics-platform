name: tests

on:
  push:
  schedule:
    - cron: '0 2 * * *'    # nightly — builds the time series
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
        continue-on-error: true       # failures are DATA, not build breaks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: results/
          retention-days: 90
          if-no-files-found: error    # empty results = the pipeline has no input
      # HTML report: previously uploaded by the scaffold playwright.yml workflow,
      # folded in here so failures stay debuggable from a single run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
